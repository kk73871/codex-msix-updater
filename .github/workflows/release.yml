name: Build and publish release

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run validation tests
        shell: powershell
        run: .\tests\Test-CodexMsixUpdater.ps1

      - name: Build portable package
        shell: pwsh
        run: .\build-release.ps1

      - name: Update the single v1.0.0 release
        if: github.ref == 'refs/tags/v1.0.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw '无法创建 GitHub Release。' }
          }
          $assets = @(gh release view $tag --json assets --jq '.assets[].name')
          foreach ($asset in $assets) {
            if ($asset -ne 'CodexMsixUpdater.exe') {
              gh release delete-asset $tag $asset --yes
              if ($LASTEXITCODE -ne 0) { throw "无法移除多余 Release 资产：$asset" }
            }
          }
          gh release upload $tag .\dist\CodexMsixUpdater.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw '无法上传 Release 文件。' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMsixUpdater
          path: |
            dist/CodexMsixUpdater.exe
